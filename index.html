<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HJ's XO</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZSHJRJG8YT"></script>

    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag("js", new Date());

        gtag("config", "G-ZSHJRJG8YT");
    </script>
</head>

<body>

    <div id="game">

        <h1>HJ's XO</h1>

        <h2>Choose Game Mode</h2>

        <div id="modeSelection">

            <button id="pvpBtn">
                Player vs Player
            </button>

            <button id="aiBtn">
                Player vs AI
            </button>

        </div>

        <div id="sizeSelection">

            <button class="sizeBtn active" data-size="3">
                3 × 3
            </button>

            <button class="sizeBtn" data-size="4">
                4 × 4
            </button>

            <button class="sizeBtn" data-size="5">
                5 × 5
            </button>

        </div>

        <p id="status">X's Turn</p>

        <div id="board"></div>

        <button id="restartBtn">
            Restart
        </button>

    </div>

    <script src="app.js"></script>

</body>

</html>
